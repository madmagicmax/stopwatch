<style>
  :root{ --sa-top: env(safe-area-inset-top, 0px); --sa-bot: env(safe-area-inset-bottom, 0px); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;width:100%;background:#000;color:#fff;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;}
  #stage{position:fixed;top:0;left:0;width:100%;touch-action:none;}

  #app{position:absolute;inset:0;}
  #tCount{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;line-height:1;
    background:#000;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;display:none;z-index:12;}
  #tRing{position:absolute;transform:translate(-50%,-50%);background:#000;border-radius:50%;display:none;z-index:12;}
  #tRing svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  #tRing circle{fill:none;stroke:#ff9f0a;stroke-linecap:butt;}
  #tIcon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  #tHitL,#tHitR,#tHitRing{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:none;z-index:22;}
  #tabhit{position:absolute;transform:translate(-50%,-50%);display:flex;z-index:20;}
  #tabhit i{flex:1;height:100%;display:block;}
  #calib.on ~ #stage #tabhit{outline:1px dashed rgba(10,132,255,.6);}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  #bg.on{display:block;}
  #statusMask{position:absolute;top:0;left:0;right:0;height:calc(var(--sa-top) + 8px);background:#000;display:none;}
  #statusMask.on{display:block;}

  /* grosse Zahl */
  #timeEl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;line-height:1;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;text-align:center;}

  /* Rundenliste, oben verankert */
  #lapsEl{position:absolute;transform:translateX(-50%);overflow:hidden;}
  #lapsEl.topline{border-top:.5px solid rgba(255,255,255,.165);}
  .lapRow{display:flex;justify-content:space-between;align-items:center;
    border-bottom:.5px solid rgba(255,255,255,.165);
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  .lapRow span{color:#fff;}
  .lapRow.fast span{color:#30d158;}
  .lapRow.slow span{color:#ff453a;}

  /* Tasten */
  .btn{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:400;transition:filter .07s;}
  .btn span{white-space:nowrap;}
  .btn.down{filter:brightness(.62);}

  /* iOS-Rahmen */
  #dots{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;}
  #dots i{display:block;border-radius:50%;}
  #tabbar{position:absolute;left:50%;transform:translateX(-50%);
    background:rgba(30,30,32,.82);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    display:flex;align-items:center;}
  #tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;position:relative;height:100%;}
  #tabbar .tab svg{display:block;}
  #tabbar .tab{color:#fff;}
  #tabbar .tab.sel{color:#ff9f0a;}
  #tabbar .tab em{font-style:normal;font-size:10px;font-weight:500;color:inherit;letter-spacing:.1px;}
  #tabbar .pill{position:absolute;border-radius:999px;background:#2f2f31;z-index:0;}
  #tabbar .tab>*{position:relative;z-index:1;}
  #chrome{position:absolute;inset:0;}
  #chrome.off{display:none;}

  /* Kalibrierung */
  #calib{position:fixed;top:0;left:0;width:100%;display:none;z-index:50;pointer-events:none;}
  #calib.on{display:block;}
  .cbox{position:absolute;border:1px dashed rgba(10,132,255,.95);pointer-events:auto;border-radius:4px;}
  .cbox.circle{border-radius:50%;}
  .cbox b{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;
    background:#0a84ff;color:#fff;padding:1px 5px;border-radius:6px;white-space:nowrap;}
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:rgba(28,28,30,.97);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border-top:.5px solid rgba(255,255,255,.15);padding:10px 14px calc(12px + var(--sa-bot));
    max-height:64vh;overflow-y:auto;font-size:12px;touch-action:auto;}
  #panel.on{display:block;}
  #panel h3{margin:0 0 8px;font-size:13px;font-weight:600;}
  .pnav{display:flex;gap:5px;margin-bottom:6px;}
  .pnav button{flex:1;min-width:52px;background:#2c2c2e;color:#fff;border:none;padding:9px 2px;
    border-radius:9px;font-size:11px;}
  .pnav button.sel{background:#0a84ff;}
  .grp{font-size:10px;color:#636366;text-transform:uppercase;letter-spacing:.5px;margin:13px 0 3px;}
  .ctl{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .ctl .lb{flex:1;color:#d1d1d6;font-size:12px;}
  .st{display:flex;align-items:center;background:#2c2c2e;border-radius:9px;overflow:hidden;}
  .st button{width:40px;height:34px;background:none;border:none;color:#0a84ff;font-size:18px;line-height:1;}
  .st span{min-width:58px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;color:#fff;}
  .tg{min-width:78px;height:34px;border-radius:9px;border:none;background:#2c2c2e;color:#8e8e93;font-size:12px;}
  .tg.on{background:#30d158;color:#04290f;}
  .prow{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}
  .pbtn{flex:1;min-width:88px;background:#2c2c2e;color:#fff;border:none;padding:11px 6px;border-radius:9px;font-size:11px;}
  .pbtn.warn{background:#5a1f1f;} .pbtn.sel{background:#0a84ff;}
  .pfoot{margin-top:14px;} .pfoot button{width:100%;background:#0a84ff;color:#fff;border:none;padding:12px;border-radius:10px;font-size:13px;}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .tabs button{flex:1;min-width:64px;background:#2c2c2e;color:#fff;border:none;padding:7px 4px;
    border-radius:8px;font-size:11px;}
  .tabs button.sel{background:#0a84ff;}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0;}
  .row label{width:92px;color:#98989d;flex:none;}
  .row input[type=range]{flex:1;accent-color:#0a84ff;}
  .row .val{width:48px;text-align:right;font-variant-numeric:tabular-nums;}
  .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .acts button,.acts label{flex:1;min-width:70px;text-align:center;background:#2c2c2e;color:#fff;
    border:none;padding:9px 6px;border-radius:9px;font-size:11px;}
  .acts .ok{background:#0a84ff;}
  .acts .warn{background:#5a1f1f;}
  .sect{display:none;} .sect.on{display:block;}
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- Force: alle Paare aus 2,3,5,6 ohne Doppel ---------- */
/* Gezogen wird aus einem Beutel: jeder der achtzehn Werte kommt einmal pro
   Durchlauf, zwei gleiche nie hintereinander. Erst danach wird die Zeit auf
   den gezogenen Wert gelegt. Dadurch ist die Verteilung gleichmaessig,
   die Abweichung zur echten Zeit betraegt hoechstens 0,5 s. */
// Ziffern 2,3,5,6,9 ohne Doppel, ohne 25 und 52
var VALID=[23,26,29,32,35,36,39,53,56,59,62,63,65,69,92,93,95,96];
var bag=[], lastVal=null;
try{
  var st=JSON.parse(localStorage.getItem("uhr.bag")||"null");
  if(st&&Array.isArray(st.bag)){
    // alte Werte aus einer frueheren Menge verwerfen
    bag=st.bag.filter(function(v){ return VALID.indexOf(v)>=0; });
    lastVal=(VALID.indexOf(st.last)>=0)?st.last:null;
  }
}catch(e){}
function saveBag(){ try{ localStorage.setItem("uhr.bag",JSON.stringify({bag:bag,last:lastVal})); }catch(e){} }
function refill(){
  bag=VALID.slice();
  for(var i=bag.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)), t=bag[i]; bag[i]=bag[j]; bag[j]=t;
  }
  // naechster Zug ist das letzte Element; nie zweimal derselbe Wert
  if(lastVal!==null&&bag[bag.length-1]===lastVal){
    var u=bag[bag.length-1]; bag[bag.length-1]=bag[0]; bag[0]=u;
  }
}
function draw(){
  if(!bag.length) refill();
  var v=bag.pop(); lastVal=v; saveBag(); return v;
}
// Legt ms auf den gezogenen Hundertstelwert, auf die naechstgelegene Sekunde,
// aber immer echt groesser als minMs (Monotonie ueber Runden hinweg).
function placeMs(ms,minMs){
  var v=draw(), sec=Math.floor(ms/1000), best=null, bestErr=Infinity;
  for(var d=-1;d<=2;d++){
    var c=(sec+d)*1000+v*10;
    if(c<0) continue;
    if(minMs!==undefined&&c<=minMs) continue;
    var e=Math.abs(c-ms);
    if(e<bestErr){ bestErr=e; best=c; }
  }
  return best===null?((sec+3)*1000+v*10):best;
}

/* ---------- Uhr ---------- */
var running=false, base=0, t0=0, bounds=[];
function nowMs(){ return running ? base+(performance.now()-t0) : base; }
function fix(ms,minMs){ return CFG.force ? placeMs(ms,minMs) : Math.round(ms); }
function start(){ t0=performance.now(); running=true; wake(); }
function stop(){
  var prev=bounds.length?bounds[bounds.length-1]:undefined;
  base=fix(nowMs(),prev); running=false; release();
}
function lap(){
  var prev=bounds.length?bounds[bounds.length-1]:0;
  var b=fix(nowMs(),prev);
  if(b<=prev) b=prev+10;
  bounds.push(b);
  if(running){ base=b; t0=performance.now(); }
}
function reset(){ running=false; base=0; t0=0; bounds=[]; release(); }
function isZero(){ return !running && base===0 && bounds.length===0; }

function two(n){ return n<10?"0"+n:""+n; }
function fmt(ms){
  if(ms<0) ms=0;
  var cs=Math.floor(ms/10)%100, tot=Math.floor(ms/1000);
  var s=tot%60, m=Math.floor(tot/60)%60, h=Math.floor(tot/3600);
  return (h>0?(h+":"+two(m)):two(m))+":"+two(s)+","+two(cs);
}

/* ---------- Konfiguration, Werte aus den Screenshots ---------- */
var DEF={
  bg:null, bg1:null, bg2:null, bg3:null, bg3r:null, bg3p:null, fit:1, mask:0, chrome:1, force:1, shift:0, area:0,
  t:{size:22.6, weight:200, track:0, x:49.9, y:29.1},
  l:{on:1, size:17, rowh:10.78, w:92.45, h:34, x:50, y:57.44, col:1},
  b:{d:20.8, size:17.5, lx:14.47, rx:85.53, y:50.8},
  tb:{y:94.03, h:15.34, w:89.47}, view:2,
  tm:{on:0, min:7, sek:10,
      cx:22.0, cy:28.6, csize:26.2, cweight:250, cwidth:0.55,
      rx:85.53, ry:27.86, rd:15.84, rw:1.0,
      by:56.24}
};
var CFG=load();
function load(){
  try{
    var raw=localStorage.getItem("uhr.cfg.v2");
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    return merge(JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function merge(o){
  var d=JSON.parse(JSON.stringify(DEF));
  for(var k in o){
    if(o[k]!==null&&typeof o[k]==="object"&&d[k]){ for(var k2 in o[k]) d[k][k2]=o[k][k2]; }
    else d[k]=o[k];
  }
  return d;
}
function save(){
  try{ localStorage.setItem("uhr.cfg.v2", JSON.stringify(CFG)); return true; }
  catch(e){ return false; }
}
function cfgBytes(){ try{ return JSON.stringify(CFG).length; }catch(e){ return 0; } }

/* ---------- Elemente ---------- */
var stage=document.getElementById("stage"), bgEl=document.getElementById("bg"),
    maskEl=document.getElementById("statusMask"), chrome=document.getElementById("chrome"),
    timeEl=document.getElementById("timeEl"), lapsEl=document.getElementById("lapsEl"),
    btnL=document.getElementById("btnL"), btnR=document.getElementById("btnR"),
    dots=document.getElementById("dots"), tabbar=document.getElementById("tabbar"),
    calib=document.getElementById("calib"), panel=document.getElementById("panel"),
    app=document.getElementById("app"), tabhit=document.getElementById("tabhit"),
    tCount=document.getElementById("tCount"), tRing=document.getElementById("tRing"),
    tArc=document.getElementById("tArc"), tIcon=document.getElementById("tIcon"),
    tHitL=document.getElementById("tHitL"), tHitR=document.getElementById("tHitR"),
    tHitRing=document.getElementById("tHitRing");
function vw(v){ return v*window.innerWidth/100; }

/* iOS meldet einer Home-Bildschirm-App mit black-translucent eine um die
   Statusleiste verkuerzte Viewport-Hoehe, zeichnet aber ueber den ganzen
   Schirm. Ohne Korrektur rutscht das Layout nach oben und unten bleibt ein
   schwarzer Balken. Darum rechnen wir mit der echten Bildschirmhoehe. */
var STAGEH=window.innerHeight, OFFSET=0, DIAG="";

/* Misst env(safe-area-inset-top). Ist der Wert groesser null, liegt die Seite
   UNTER der Statusleiste (Modus black-translucent) und das Fenster klebt oben,
   der fehlende Streifen ist dann unten und nicht erreichbar. Ist er null,
   beginnt das Fenster unter der Statusleiste und der fehlende Streifen ist
   oben, den koennen wir wegschieben. */
function probeInset(side){
  var d=document.createElement("div");
  d.style.cssText="position:fixed;left:0;width:0;visibility:hidden;"+
    (side==="top" ? "top:0;height:env(safe-area-inset-top,0px);"
                  : "bottom:0;height:env(safe-area-inset-bottom,0px);");
  document.body.appendChild(d);
  var v=d.offsetHeight;
  document.body.removeChild(d);
  return v;
}
function fitStage(){
  var ih=window.innerHeight;
  var sh=(window.screen&&window.screen.height)||ih;
  var standalone=!!window.navigator.standalone;
  var safeTop=probeInset("top"), safeBot=probeInset("bottom");
  var h=ih, off=0, mode="Browser";
  if(standalone){
    if(sh>ih+2 && safeTop<=1){ off=sh-ih; h=sh; mode="unter Statusleiste"; }
    else if(sh>ih+2){ mode="transluzent, Fenster kuerzer um "+(sh-ih)+" px"; }
    else { mode="Vollbild"; }
  }
  if(CFG.area===1){ h=ih; off=0; mode="manuell: Fenster"; }
  else if(CFG.area===2){ h=sh; off=sh-ih; mode="manuell: Schirm"; }
  off+=(CFG.shift||0);
  STAGEH=h; OFFSET=off;
  stage.style.height=h+"px";  stage.style.top=(-off)+"px";
  calib.style.height=h+"px";  calib.style.top=(-off)+"px";
  DIAG="Fenster "+window.innerWidth+"×"+ih+" · Schirm "+(window.screen?window.screen.width:"?")+"×"+sh+
       " · safe oben "+safeTop+" unten "+safeBot+
       " · standalone "+(standalone?"ja":"nein")+" · "+mode+" · Versatz "+off;
  var el=document.getElementById("diag");
  if(el) el.textContent=DIAG;
  return h;
}

/* ---------- Tab-Leiste ---------- */
var ICONS={
  welt:'<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9.2"/><ellipse cx="12" cy="12" rx="4" ry="9.2"/><path d="M2.9 12h18.2M4.6 6.6h14.8M4.6 17.4h14.8"/></svg>',
  weck:'<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13.2" r="7.7"/><path d="M12 9.3v4.1h3.1" stroke-linecap="round"/><path d="M4.1 5.4c1-1.4 2.6-2.3 3.9-2.6M19.9 5.4c-1-1.4-2.6-2.3-3.9-2.6" stroke-linecap="round"/></svg>',
  stop:'<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13.6" r="7.9"/><path d="M12 8.9v4.7" stroke-linecap="round"/><path d="M10.7 2.6h2.6" stroke-linecap="round" stroke-width="2"/><path d="M17.6 5.2l1.5-1.5" stroke-linecap="round"/></svg>',
  timer:'<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.4 8.4a9 9 0 1 1-3.6-4.2" stroke-linecap="round"/><path d="M12 12V6.2" stroke-linecap="round"/><path d="M19.2 2.6v4.3h-4.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
function buildTabs(){
  tabbar.innerHTML='<div class="pill"></div>'+
    '<div class="tab">'+ICONS.welt+'<em>Weltuhr</em></div>'+
    '<div class="tab">'+ICONS.weck+'<em>Wecker</em></div>'+
    '<div class="tab">'+ICONS.stop+'<em>Stoppuhr</em></div>'+
    '<div class="tab">'+ICONS.timer+'<em>Timer</em></div>';
}
function layoutTabs(){
  var w=window.innerWidth, h=STAGEH;
  var bw=w*0.8947, bh=w*0.156;

/* ---------- Timer ---------- */
var tState=0, tLeft=0, tT0=0;
function tTotal(){ return (CFG.tm.min*60+CFG.tm.sek)*1000; }
function tNow(){ return tState===1 ? Math.max(0, tLeft-(performance.now()-tT0)) : tLeft; }
function tSet(st){ tState=st; bgKey=null; setBgFor(3); paintTimer(); }
function tStart(){ tLeft=tTotal(); tT0=performance.now(); tSet(1); wake(); }
function tToggle(){
  if(tState===1){ tLeft=tNow(); tSet(2); release(); }
  else if(tState===2){ tT0=performance.now(); tSet(1); wake(); }
}
function tCancel(){ tLeft=0; tSet(0); release(); }
function fmtT(ms){
  var t=Math.ceil(ms/1000), h=Math.floor(t/3600), m=Math.floor(t/60)%60, sec=t%60;
  return h>0 ? (h+":"+two(m)+":"+two(sec)) : (two(m)+":"+two(sec));
}
function paintTimer(){
  if(!CFG.tm.on && !calibOn) tState=0;
  var on=(curTab===3)&&!!CFG.tm.on, live=on&&tState>0;

  tRing.style.display=live?"block":"none";

  tHitR.style.display=(on&&tState===0)?"block":"none";
  tHitRing.style.display=live?"block":"none";
  if(!live) return;
  tCount.style.color=(tState===1)?"#fff":"#8e8e93";
  tArc.style.stroke=(tState===1)?"#ff9f0a":"#ff9f0a";
  var w=vw(CFG.tm.rd)*0.26;
  tIcon.innerHTML = (tState===1)
    ? '<svg width="'+w+'" height="'+w+'" viewBox="0 0 10 12"><rect x="0" y="0" width="3.4" height="12" rx="1.1" fill="#ff9f0a"/><rect x="6.6" y="0" width="3.4" height="12" rx="1.1" fill="#ff9f0a"/></svg>'
    : '<svg width="'+w+'" height="'+w+'" viewBox="0 0 11 12"><path d="M1 1.1 10 6 1 10.9z" fill="#ff9f0a"/></svg>';
}
function layoutTimer(){
  var t=CFG.tm;
  tCount.style.left=t.cx+"%"; tCount.style.top=t.cy+"%";
  tCount.style.fontSize=t.csize+"vw"; tCount.style.fontWeight=t.cweight;
  tCount.style.transform="translate(-50%,-50%) scaleX("+t.cwidth+")";
  tCount.style.padding="0.06em 0.10em";
  var d=vw(t.rd);
  tRing.style.left=t.rx+"%"; tRing.style.top=t.ry+"%";
  tRing.style.width=(d*1.16)+"px"; tRing.style.height=(d*1.16)+"px";
  var sv=tRing.querySelector("svg");
  sv.style.inset=(d*0.08)+"px";
  sv.style.width=d+"px"; sv.style.height=d+"px";
  tArc.style.strokeWidth=(vw(t.rw)/d*100)+"";
  [[tHitL,14.47,t.by],[tHitR,85.53,t.by],[tHitRing,t.rx,t.ry]].forEach(function(p,i){
    p[0].style.left=p[1]+"%"; p[0].style.top=p[2]+"%";
    var dd=(i===2)?d*1.16:vw(CFG.b.d);
    p[0].style.width=dd+"px"; p[0].style.height=dd+"px";
  });
}
function renderTimer(){
  if(curTab!==3||tState===0) return;
  var left=tNow();
  tCount.textContent=fmtT(left);
  var frac=Math.max(0,Math.min(1,left/Math.max(1,tTotal())));
  var C=2*Math.PI*45;
  tArc.style.strokeDasharray=C;
  tArc.style.strokeDashoffset=C*(1-frac);
  if(tState===1&&left<=0) tCancel();
}

  el.addEventListener("pointerdown",function(e){ if(calibOn) return; e.preventDefault(); fn(); },{passive:false});
}

/* ---------- Rendering ---------- */
var lastLaps="", lastTime="";
function renderLaps(t){
  if(!CFG.l.on) return;
  var prev=0, durs=[];
  for(var i=0;i<bounds.length;i++){ durs.push(bounds[i]-prev); prev=bounds[i]; }
  var cur=t-prev, rows=[];
  var fastI=-1, slowI=-1;
  if(CFG.l.col && durs.length>=2){
    var mn=Infinity,mx=-Infinity;
    for(var j=0;j<durs.length;j++){
      if(durs[j]<mn){mn=durs[j];fastI=j;}
      if(durs[j]>mx){mx=durs[j];slowI=j;}
    }
    if(mn===mx){fastI=-1;slowI=-1;}
  }
  var st='style="height:'+CFG.l.rowh+'vw"';
  if(!isZero()){
    rows.push('<div class="lapRow" '+st+'><span>Runde '+(durs.length+1)+'</span><span>'+fmt(cur)+'</span></div>');
  }
  for(var k=durs.length-1;k>=0;k--){
    var cls="lapRow"+(k===fastI?" fast":(k===slowI?" slow":""));
    rows.push('<div class="'+cls+'" '+st+'><span>Runde '+(k+1)+'</span><span>'+fmt(durs[k])+'</span></div>');
  }
  var html=rows.join("");
  if(html!==lastLaps){ lapsEl.innerHTML=html; lastLaps=html; }
}
function frame(){
  var t=nowMs(), s=fmt(t);
  if(s!==lastTime){ timeEl.textContent=s; lastTime=s; }
  renderLaps(t);
  renderTimer();
  requestAnimationFrame(frame);
}

/* ---------- Bildschirm wach halten ----------
   Solange die App im Vordergrund ist, bleibt der Bildschirm an, egal ob die
   Stoppuhr laeuft oder steht. Zwei Wege gleichzeitig: die Wake-Lock-Schnittstelle
   und als Rueckfall ein stummes Endlosvideo, das iOS am Sperren hindert. */
var wl=null, vid=document.getElementById("wakeVid");
function keepAwake(){
  if(document.visibilityState!=="visible") return;
  if("wakeLock" in navigator && !wl){
    navigator.wakeLock.request("screen").then(function(l){
      wl=l; l.addEventListener("release",function(){ wl=null; });
    }).catch(function(){});
  }
  if(vid){ vid.muted=true; var pr=vid.play(); if(pr&&pr.catch) pr.catch(function(){}); }
}
function wake(){ keepAwake(); }
function release(){ /* bewusst leer: wir halten den Bildschirm dauerhaft an */ }
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible") keepAwake();
});
document.addEventListener("pointerdown",keepAwake,{passive:true,capture:true});
document.addEventListener("touchstart",keepAwake,{passive:true,capture:true});
setInterval(function(){ if(!wl||(vid&&vid.paused)) keepAwake(); },15000);

     set:function(x,y){CFG.b.rx=x;CFG.b.y=y;}}

    el.innerHTML="<b>"+d.label+"</b>";
    calib.appendChild(el);
    boxes.push({el:el,d:d});
    var drag=null;
    el.addEventListener("pointerdown",function(e){
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      var g=d.get();
      drag={dx:e.clientX-window.innerWidth*g.x/100, dy:e.clientY-(STAGEH*g.y/100-OFFSET)};
    },{passive:false});

      var x=(e.clientX-drag.dx)/window.innerWidth*100;
      var y=(e.clientY-drag.dy+OFFSET)/STAGEH*100;
      d.set(Math.max(0,Math.min(100,+x.toFixed(1))),Math.max(0,Math.min(100,+y.toFixed(1))));
      applyLayout(); syncInputs(); positionBoxes();

    ["pointerup","pointercancel"].forEach(function(ev){
      el.addEventListener(ev,function(){ drag=null; save(); });
    });
  });

  boxes.forEach(function(b){

    b.el.style.top=g.y+"%";

function fmtv(c,v){

}
function ctlRow(c){
  var row=document.createElement("div"); row.className="ctl";
  var lb=document.createElement("div"); lb.className="lb"; lb.textContent=c.l; row.appendChild(lb);
  if(c.b||c.ch){
    var t=document.createElement("button"); t.className="tg";
    var upd=function(){ var v=gv(c.k); t.textContent=fmtv(c,v); t.classList.toggle("on",!!v); };
    upd();
    t.addEventListener("click",function(){
      var v=gv(c.k), n=c.ch?((v+1)%c.ch.length):(v?0:1);
      sv(c.k,n); upd(); after(c.k);
    });
    row.appendChild(t);
  } else {

    var minus=document.createElement("button"); minus.textContent="−";
    var val=document.createElement("span");
    var plus=document.createElement("button"); plus.textContent="+";
    var upd=function(){ val.textContent=fmtv(c,gv(c.k)); };
    upd();
    var step=function(dir){
      var v=gv(c.k)+dir*c.st;
      v=Math.max(c.mi,Math.min(c.ma,Math.round(v*1000)/1000));
      sv(c.k,v); upd(); after(c.k);
    };
    [[minus,-1],[plus,1]].forEach(function(pr){
      var timer=null, fast=null;
      pr[0].addEventListener("pointerdown",function(e){
        e.preventDefault(); step(pr[1]);
        timer=setTimeout(function(){ fast=setInterval(function(){ step(pr[1]); },70); },420);
      },{passive:false});
      ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
        pr[0].addEventListener(ev,function(){ clearTimeout(timer); clearInterval(fast); });
      });

}
function tslotRow(){
  var wrap=document.createElement("div"); wrap.className="prow";
  [["Ruhe",3],["läuft",4],["pausiert",5]].forEach(function(pr){
    var b=document.createElement("button");
    b.className="pbtn"+(CFG.view===pr[1]?" sel":"");
    b.textContent=pr[0];
    b.addEventListener("click",function(){
      CFG.view=pr[1]; tState=VIEWS[pr[1]].ts; bgKey=null;
      setTab(3); syncInputs(); save();
    });
    wrap.appendChild(b);
  });
  return wrap;
}
function syncInputs(){
  var nav=document.getElementById("pnav"), body=document.getElementById("pbody");
  if(!nav||!body) return;
  nav.innerHTML="";
  NAV.forEach(function(it,i){
    var b=document.createElement("button");
    b.textContent=it.n; b.className=(i===navSel?"sel":"");
    b.addEventListener("click",function(){
      navSel=i;
      if(it.v!==9){
        CFG.view=(it.v===3?3:it.v);
        if(VIEWS[CFG.view].ts!==undefined) tState=VIEWS[CFG.view].ts;
        bgKey=null; setTab(VIEWS[CFG.view].t);
      }
      syncInputs(); save();
    });
    nav.appendChild(b);
  });
  body.innerHTML="";
  SEC(NAV[navSel].v).forEach(function(c){
    if(c.g){ var h=document.createElement("div"); h.className="grp"; h.textContent=c.g; body.appendChild(h); return; }
    if(c.img){ body.appendChild(imgRow()); return; }
    if(c.tslot){ body.appendChild(tslotRow()); return; }
    if(c.diag){ var d=document.createElement("div"); d.id="diag";
      d.style.cssText="margin-top:10px;color:#98989d;font-size:10px;line-height:1.5;word-break:break-word";
      d.textContent=DIAG+" · Speicher "+Math.round(cfgBytes()/1024)+" kB"; body.appendChild(d); return; }
    if(c.act){
      var w=document.createElement("div"); w.className="prow";
      var b=document.createElement("button"); w.appendChild(b);
      if(c.act==="code"){ b.className="pbtn"; b.textContent="Einstellungen sichern";
        b.addEventListener("click",function(){
          var cc=JSON.parse(JSON.stringify(CFG));
          delete cc.bg; delete cc.bg1; delete cc.bg2; delete cc.bg3; delete cc.bg3r; delete cc.bg3p;
          var inp=window.prompt("Sichern oder einfügen:",JSON.stringify(cc));
          if(inp){ try{ var o=JSON.parse(inp), keep={};
            ["bg","bg1","bg2","bg3","bg3r","bg3p"].forEach(function(k){ keep[k]=CFG[k]; });
            CFG=merge(o);
            ["bg","bg1","bg2","bg3","bg3r","bg3p"].forEach(function(k){ CFG[k]=keep[k]; });
            fitStage(); applyLayout(); buildCalib(); syncInputs(); save();
          }catch(e){ window.alert("Code nicht lesbar."); } }
        });
      } else { b.className="pbtn warn"; b.textContent="Auf Standard zurück";
        b.addEventListener("click",function(){
          if(!window.confirm("Alle Werte zurücksetzen? Bilder bleiben.")) return;
          var keep={}; ["bg","bg1","bg2","bg3","bg3r","bg3p"].forEach(function(k){ keep[k]=CFG[k]; });
          CFG=JSON.parse(JSON.stringify(DEF));
          ["bg","bg1","bg2","bg3","bg3r","bg3p"].forEach(function(k){ CFG[k]=keep[k]; });
          fitStage(); applyLayout(); buildCalib(); syncInputs(); save();
        });
      }
      body.appendChild(w); return;
    }
    body.appendChild(ctlRow(c));
  });
}
document.getElementById("done").addEventListener("click",function(){ setCalib(false); });

function shrink(dataUrl,cb){
  var im=new Image();
  im.onload=function(){
    var tw=Math.min(im.width, Math.round(window.innerWidth*3));
    var th=Math.round(im.height*tw/im.width);
    var cv=document.createElement("canvas"); cv.width=tw; cv.height=th;
    cv.getContext("2d").drawImage(im,0,0,tw,th);
    var out=null;
    try{ out=cv.toDataURL("image/webp",0.86); }catch(e){}
    if(!out||out.indexOf("data:image/webp")!==0){
      try{ out=cv.toDataURL("image/jpeg",0.9); }catch(e){ out=dataUrl; }
    }
    cb(out.length<dataUrl.length?out:dataUrl);
  };
  im.onerror=function(){ cb(dataUrl); };
  im.src=dataUrl;
}
document.getElementById("file").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    shrink(r.result,function(small){
      var key=VIEWS[CFG.view].k, before=CFG[key];
      CFG[key]=small; CFG.chrome=0; bgKey=null;
      if(!save()){
        CFG[key]=before; bgKey=null;
        window.alert("Speicher voll. Lösch ein anderes Bild und versuch es nochmal.");
      }
      setTab(VIEWS[CFG.view].t); applyLayout(); syncInputs();
    });
  };
  r.readAsDataURL(f);
  e.target.value="";
});

/* ---------- Start ---------- */
window.addEventListener("resize",function(){ fitStage(); applyLayout(); positionBoxes(); });
window.addEventListener("orientationchange",function(){ setTimeout(function(){ fitStage(); applyLayout(); },300); });
buildTabs();
fitStage();
CFG.view=2;
tState=0;
setTab(2);
applyLayout();
requestAnimationFrame(frame);
})();
</script>
