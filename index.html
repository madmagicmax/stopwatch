<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Uhr">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#000000">
<title>Uhr</title>
<style>
  :root{ --sa-top: env(safe-area-inset-top, 0px); --sa-bot: env(safe-area-inset-bottom, 0px); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;width:100%;background:#000;color:#fff;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;}
  #stage{position:fixed;top:0;left:0;width:100%;touch-action:none;}

  #app{position:absolute;inset:0;}
  #tCount{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;line-height:1;
    background:#000;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;display:none;z-index:12;}
  #tRing{position:absolute;transform:translate(-50%,-50%);background:#000;border-radius:50%;display:none;z-index:12;}
  #tRing svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  #tRing circle{fill:none;stroke:#ff9f0a;stroke-linecap:butt;}
  #tIcon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  #tHitL,#tHitR,#tHitRing{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:none;z-index:22;}
  #tabhit{position:absolute;transform:translate(-50%,-50%);display:flex;z-index:20;}
  #tabhit i{flex:1;height:100%;display:block;}
  #calib.on ~ #stage #tabhit{outline:1px dashed rgba(10,132,255,.6);}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  #bg.on{display:block;}
  #statusMask{position:absolute;top:0;left:0;right:0;height:calc(var(--sa-top) + 8px);background:#000;display:none;}
  #statusMask.on{display:block;}

  /* grosse Zahl */
  #timeEl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;line-height:1;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;text-align:center;}

  /* Rundenliste, oben verankert */
  #lapsEl{position:absolute;transform:translateX(-50%);overflow:hidden;}
  #lapsEl.topline{border-top:.5px solid rgba(255,255,255,.165);}
  .lapRow{display:flex;justify-content:space-between;align-items:center;
    border-bottom:.5px solid rgba(255,255,255,.165);
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  .lapRow span{color:#fff;}
  .lapRow.fast span{color:#30d158;}
  .lapRow.slow span{color:#ff453a;}

  /* Tasten */
  .btn{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:400;transition:filter .07s;}
  .btn span{white-space:nowrap;}
  .btn.down{filter:brightness(.62);}

  /* iOS-Rahmen */
  #dots{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;}
  #dots i{display:block;border-radius:50%;}
  #tabbar{position:absolute;left:50%;transform:translateX(-50%);
    background:rgba(30,30,32,.82);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    display:flex;align-items:center;}
  #tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;position:relative;height:100%;}
  #tabbar .tab svg{display:block;}
  #tabbar .tab{color:#fff;}
  #tabbar .tab.sel{color:#ff9f0a;}
  #tabbar .tab em{font-style:normal;font-size:10px;font-weight:500;color:inherit;letter-spacing:.1px;}
  #tabbar .pill{position:absolute;border-radius:999px;background:#2f2f31;z-index:0;}
  #tabbar .tab>*{position:relative;z-index:1;}
  #chrome{position:absolute;inset:0;}
  #chrome.off{display:none;}

  /* Kalibrierung */
  #calib{position:fixed;top:0;left:0;width:100%;display:none;z-index:50;pointer-events:none;}
  #calib.on{display:block;}
  .cbox{position:absolute;border:1px dashed rgba(10,132,255,.95);pointer-events:auto;border-radius:4px;}
  .cbox.circle{border-radius:50%;}
  .cbox b{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;
    background:#0a84ff;color:#fff;padding:1px 5px;border-radius:6px;white-space:nowrap;}
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:rgba(28,28,30,.97);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border-top:.5px solid rgba(255,255,255,.15);padding:10px 14px calc(12px + var(--sa-bot));
    max-height:64vh;overflow-y:auto;font-size:12px;touch-action:auto;}
  #panel.on{display:block;}
  #panel h3{margin:0 0 8px;font-size:13px;font-weight:600;}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .tabs button{flex:1;min-width:64px;background:#2c2c2e;color:#fff;border:none;padding:7px 4px;
    border-radius:8px;font-size:11px;}
  .tabs button.sel{background:#0a84ff;}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0;}
  .row label{width:92px;color:#98989d;flex:none;}
  .row input[type=range]{flex:1;accent-color:#0a84ff;}
  .row .val{width:48px;text-align:right;font-variant-numeric:tabular-nums;}
  .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .acts button,.acts label{flex:1;min-width:70px;text-align:center;background:#2c2c2e;color:#fff;
    border:none;padding:9px 6px;border-radius:9px;font-size:11px;}
  .acts .ok{background:#0a84ff;}
  .acts .warn{background:#5a1f1f;}
  .sect{display:none;} .sect.on{display:block;}
</style>
</head>
<body>
<div id="stage">
  <div id="app">
    <img id="bg" alt="">
    <div id="statusMask"></div>

    <div id="chrome">
      <div id="dots"><i></i><i></i></div>
      <div id="tabbar"></div>
    </div>

    <div id="timeEl">00:00,00</div>
    <div id="lapsEl"></div>
    <div class="btn" id="btnL"><span>Runde</span></div>
    <div class="btn" id="btnR"><span>Start</span></div>
    <div id="tCount"></div>
    <div id="tRing"><svg viewBox="0 0 100 100"><circle id="tArc" cx="50" cy="50" r="45"/></svg><div id="tIcon"></div></div>
    <div id="tabhit"><i></i><i></i><i></i><i></i></div>
    <div id="tHitL"></div><div id="tHitR"></div><div id="tHitRing"></div>
  </div>
</div>

<div id="calib"></div>

<div id="panel">
  <h3>Kalibrierung</h3>
  <div class="row" style="margin:0 0 10px"><label>Ansicht</label><input type="range" id="m_view" min="0" max="5" step="1"><span class="val" id="m_view_v" style="width:96px"></span></div>
  <div class="tabs">
    <button data-sect="s-time" class="sel">Zeit</button>
    <button data-sect="s-laps">Runden</button>
    <button data-sect="s-btn">Tasten</button>
    <button data-sect="s-timer">Timer</button>
    <button data-sect="s-misc">Allgemein</button>
  </div>
  <div class="sect on" id="s-time">
    <div class="row"><label>Größe</label><input type="range" id="t_size" min="10" max="32" step="0.1"><span class="val" id="t_size_v"></span></div>
    <div class="row"><label>Stärke</label><input type="range" id="t_weight" min="100" max="500" step="50"><span class="val" id="t_weight_v"></span></div>
    <div class="row"><label>Laufweite</label><input type="range" id="t_track" min="-8" max="8" step="0.1"><span class="val" id="t_track_v"></span></div>
    <div class="row"><label>X</label><input type="range" id="t_x" min="0" max="100" step="0.1"><span class="val" id="t_x_v"></span></div>
    <div class="row"><label>Y</label><input type="range" id="t_y" min="0" max="100" step="0.1"><span class="val" id="t_y_v"></span></div>
  </div>
  <div class="sect" id="s-laps">
    <div class="row"><label>Anzeigen</label><input type="range" id="l_on" min="0" max="1" step="1"><span class="val" id="l_on_v"></span></div>
    <div class="row"><label>Schrift</label><input type="range" id="l_size" min="10" max="26" step="0.5"><span class="val" id="l_size_v"></span></div>
    <div class="row"><label>Zeilenhöhe</label><input type="range" id="l_rowh" min="5" max="18" step="0.1"><span class="val" id="l_rowh_v"></span></div>
    <div class="row"><label>Breite</label><input type="range" id="l_w" min="40" max="100" step="0.5"><span class="val" id="l_w_v"></span></div>
    <div class="row"><label>Höhe</label><input type="range" id="l_h" min="10" max="60" step="0.5"><span class="val" id="l_h_v"></span></div>
    <div class="row"><label>X</label><input type="range" id="l_x" min="0" max="100" step="0.1"><span class="val" id="l_x_v"></span></div>
    <div class="row"><label>Oben</label><input type="range" id="l_y" min="0" max="100" step="0.1"><span class="val" id="l_y_v"></span></div>
    <div class="row"><label>Grün/Rot</label><input type="range" id="l_col" min="0" max="1" step="1"><span class="val" id="l_col_v"></span></div>
  </div>
  <div class="sect" id="s-timer">
    <div class="row"><label>Timer aktiv</label><input type="range" id="tm_on" min="0" max="1" step="1"><span class="val" id="tm_on_v"></span></div>
    <div class="row"><label>Dauer Min</label><input type="range" id="tm_min" min="0" max="59" step="1"><span class="val" id="tm_min_v"></span></div>
    <div class="row"><label>Dauer Sek</label><input type="range" id="tm_sek" min="0" max="59" step="1"><span class="val" id="tm_sek_v"></span></div>
    <div class="row"><label>Zahl Größe</label><input type="range" id="tm_csize" min="8" max="40" step="0.2"><span class="val" id="tm_csize_v"></span></div>
    <div class="row"><label>Zahl Breite</label><input type="range" id="tm_cwidth" min="0.3" max="1.3" step="0.01"><span class="val" id="tm_cwidth_v"></span></div>
    <div class="row"><label>Zahl Stärke</label><input type="range" id="tm_cweight" min="100" max="500" step="50"><span class="val" id="tm_cweight_v"></span></div>
    <div class="row"><label>Zahl X</label><input type="range" id="tm_cx" min="0" max="100" step="0.1"><span class="val" id="tm_cx_v"></span></div>
    <div class="row"><label>Zahl Y</label><input type="range" id="tm_cy" min="0" max="100" step="0.1"><span class="val" id="tm_cy_v"></span></div>
    <div class="row"><label>Ring X</label><input type="range" id="tm_rx" min="0" max="100" step="0.1"><span class="val" id="tm_rx_v"></span></div>
    <div class="row"><label>Ring Y</label><input type="range" id="tm_ry" min="0" max="100" step="0.1"><span class="val" id="tm_ry_v"></span></div>
    <div class="row"><label>Ring Größe</label><input type="range" id="tm_rd" min="6" max="30" step="0.1"><span class="val" id="tm_rd_v"></span></div>
    <div class="row"><label>Ring Stärke</label><input type="range" id="tm_rw" min="0.3" max="3" step="0.05"><span class="val" id="tm_rw_v"></span></div>
    <div class="row"><label>Tasten Y</label><input type="range" id="tm_by" min="30" max="90" step="0.1"><span class="val" id="tm_by_v"></span></div>
  </div>

  <div class="sect" id="s-btn">
    <div class="row"><label>Durchmesser</label><input type="range" id="b_d" min="10" max="35" step="0.1"><span class="val" id="b_d_v"></span></div>
    <div class="row"><label>Schrift</label><input type="range" id="b_size" min="10" max="26" step="0.5"><span class="val" id="b_size_v"></span></div>
    <div class="row"><label>Links X</label><input type="range" id="bl_x" min="0" max="100" step="0.1"><span class="val" id="bl_x_v"></span></div>
    <div class="row"><label>Rechts X</label><input type="range" id="br_x" min="0" max="100" step="0.1"><span class="val" id="br_x_v"></span></div>
    <div class="row"><label>Y</label><input type="range" id="b_y" min="0" max="100" step="0.1"><span class="val" id="b_y_v"></span></div>
  </div>
  <div class="sect" id="s-misc">
    <div class="row"><label>Force aktiv</label><input type="range" id="m_force" min="0" max="1" step="1"><span class="val" id="m_force_v"></span></div>
    <div class="row"><label>iOS-Rahmen</label><input type="range" id="m_chrome" min="0" max="1" step="1"><span class="val" id="m_chrome_v"></span></div>
    <div class="row"><label>Statusleiste</label><input type="range" id="m_mask" min="0" max="1" step="1"><span class="val" id="m_mask_v"></span></div>
    <div class="row"><label>Bild-Fit</label><input type="range" id="m_fit" min="0" max="1" step="1"><span class="val" id="m_fit_v"></span></div>
    <div class="row"><label>Leiste Y</label><input type="range" id="tb_y" min="80" max="100" step="0.1"><span class="val" id="tb_y_v"></span></div>
    <div class="row"><label>Leiste H</label><input type="range" id="tb_h" min="8" max="24" step="0.1"><span class="val" id="tb_h_v"></span></div>
    <div class="row"><label>Fläche</label><input type="range" id="m_area" min="0" max="2" step="1"><span class="val" id="m_area_v"></span></div>
    <div class="row"><label>Versatz</label><input type="range" id="m_shift" min="-80" max="80" step="1"><span class="val" id="m_shift_v"></span></div>
    <div id="diag" style="margin-top:10px;color:#98989d;font-size:10px;line-height:1.5;word-break:break-word"></div>
  </div>
  <div class="acts">
    <label for="file" id="fileLabel">Bild laden</label>
    <input type="file" id="file" accept="image/*" style="display:none">
    <button id="clearBg">Bild weg</button>
    <button id="code">Code</button>
    <button id="reset" class="warn">Standard</button>
    <button id="done" class="ok">Fertig</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- Force: alle Paare aus 2,3,5,6 ohne Doppel ---------- */
/* Gezogen wird aus einem Beutel: jeder der zwoelf Werte kommt einmal pro
   Durchlauf, zwei gleiche nie hintereinander. Erst danach wird die Zeit auf
   den gezogenen Wert gelegt. Dadurch ist die Verteilung gleichmaessig,
   die Abweichung zur echten Zeit betraegt hoechstens 0,5 s. */
var VALID=[23,25,26,32,35,36,52,53,56,62,63,65];
var bag=[], lastVal=null;
try{
  var st=JSON.parse(localStorage.getItem("uhr.bag")||"null");
  if(st&&Array.isArray(st.bag)){ bag=st.bag; lastVal=st.last; }
}catch(e){}
function saveBag(){ try{ localStorage.setItem("uhr.bag",JSON.stringify({bag:bag,last:lastVal})); }catch(e){} }
function refill(){
  bag=VALID.slice();
  for(var i=bag.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)), t=bag[i]; bag[i]=bag[j]; bag[j]=t;
  }
  // naechster Zug ist das letzte Element; nie zweimal derselbe Wert
  if(lastVal!==null&&bag[bag.length-1]===lastVal){
    var u=bag[bag.length-1]; bag[bag.length-1]=bag[0]; bag[0]=u;
  }
}
function draw(){
  if(!bag.length) refill();
  var v=bag.pop(); lastVal=v; saveBag(); return v;
}
// Legt ms auf den gezogenen Hundertstelwert, auf die naechstgelegene Sekunde,
// aber immer echt groesser als minMs (Monotonie ueber Runden hinweg).
function placeMs(ms,minMs){
  var v=draw(), sec=Math.floor(ms/1000), best=null, bestErr=Infinity;
  for(var d=-1;d<=2;d++){
    var c=(sec+d)*1000+v*10;
    if(c<0) continue;
    if(minMs!==undefined&&c<=minMs) continue;
    var e=Math.abs(c-ms);
    if(e<bestErr){ bestErr=e; best=c; }
  }
  return best===null?((sec+3)*1000+v*10):best;
}

/* ---------- Uhr ---------- */
var running=false, base=0, t0=0, bounds=[];
function nowMs(){ return running ? base+(performance.now()-t0) : base; }
function fix(ms,minMs){ return CFG.force ? placeMs(ms,minMs) : Math.round(ms); }
function start(){ t0=performance.now(); running=true; wake(); }
function stop(){
  var prev=bounds.length?bounds[bounds.length-1]:undefined;
  base=fix(nowMs(),prev); running=false; release();
}
function lap(){
  var prev=bounds.length?bounds[bounds.length-1]:0;
  var b=fix(nowMs(),prev);
  if(b<=prev) b=prev+10;
  bounds.push(b);
  if(running){ base=b; t0=performance.now(); }
}
function reset(){ running=false; base=0; t0=0; bounds=[]; release(); }
function isZero(){ return !running && base===0 && bounds.length===0; }

function two(n){ return n<10?"0"+n:""+n; }
function fmt(ms){
  if(ms<0) ms=0;
  var cs=Math.floor(ms/10)%100, tot=Math.floor(ms/1000);
  var s=tot%60, m=Math.floor(tot/60)%60, h=Math.floor(tot/3600);
  return (h>0?(h+":"+two(m)):two(m))+":"+two(s)+","+two(cs);
}

/* ---------- Konfiguration, Werte aus den Screenshots ---------- */
var DEF={
  bg:null, bg1:null, bg2:null, bg3:null, bg3r:null, bg3p:null, fit:1, mask:0, chrome:1, force:1, shift:0, area:0,
  t:{size:22.6, weight:200, track:0, x:49.9, y:29.1},
  l:{on:1, size:17, rowh:10.78, w:92.45, h:34, x:50, y:57.44, col:1},
  b:{d:20.8, size:17.5, lx:14.47, rx:85.53, y:50.8},
  tb:{y:94.03, h:15.34, w:89.47}, view:2,
  tm:{on:0, min:7, sek:10,
      cx:22.0, cy:28.6, csize:26.2, cweight:250, cwidth:0.55,
      rx:85.53, ry:27.86, rd:15.84, rw:1.0,
      by:56.24}
};
var CFG=load();
function load(){
  try{
    var raw=localStorage.getItem("uhr.cfg.v2");
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    return merge(JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function merge(o){
  var d=JSON.parse(JSON.stringify(DEF));
  for(var k in o){
    if(o[k]!==null&&typeof o[k]==="object"&&d[k]){ for(var k2 in o[k]) d[k][k2]=o[k][k2]; }
    else d[k]=o[k];
  }
  return d;
}
function save(){
  try{ localStorage.setItem("uhr.cfg.v2", JSON.stringify(CFG)); return true; }
  catch(e){ return false; }
}
function cfgBytes(){ try{ return JSON.stringify(CFG).length; }catch(e){ return 0; } }

/* ---------- Elemente ---------- */
var stage=document.getElementById("stage"), bgEl=document.getElementById("bg"),
    maskEl=document.getElementById("statusMask"), chrome=document.getElementById("chrome"),
    timeEl=document.getElementById("timeEl"), lapsEl=document.getElementById("lapsEl"),
    btnL=document.getElementById("btnL"), btnR=document.getElementById("btnR"),
    dots=document.getElementById("dots"), tabbar=document.getElementById("tabbar"),
    calib=document.getElementById("calib"), panel=document.getElementById("panel"),
    app=document.getElementById("app"), tabhit=document.getElementById("tabhit"),
    tCount=document.getElementById("tCount"), tRing=document.getElementById("tRing"),
    tArc=document.getElementById("tArc"), tIcon=document.getElementById("tIcon"),
    tHitL=document.getElementById("tHitL"), tHitR=document.getElementById("tHitR"),
    tHitRing=document.getElementById("tHitRing");
function vw(v){ return v*window.innerWidth/100; }

/* iOS meldet einer Home-Bildschirm-App mit black-translucent eine um die
   Statusleiste verkuerzte Viewport-Hoehe, zeichnet aber ueber den ganzen
   Schirm. Ohne Korrektur rutscht das Layout nach oben und unten bleibt ein
   schwarzer Balken. Darum rechnen wir mit der echten Bildschirmhoehe. */
var STAGEH=window.innerHeight, OFFSET=0, DIAG="";

/* Misst env(safe-area-inset-top). Ist der Wert groesser null, liegt die Seite
   UNTER der Statusleiste (Modus black-translucent) und das Fenster klebt oben,
   der fehlende Streifen ist dann unten und nicht erreichbar. Ist er null,
   beginnt das Fenster unter der Statusleiste und der fehlende Streifen ist
   oben, den koennen wir wegschieben. */
function probeInset(side){
  var d=document.createElement("div");
  d.style.cssText="position:fixed;left:0;width:0;visibility:hidden;"+
    (side==="top" ? "top:0;height:env(safe-area-inset-top,0px);"
                  : "bottom:0;height:env(safe-area-inset-bottom,0px);");
  document.body.appendChild(d);
  var v=d.offsetHeight;
  document.body.removeChild(d);
  return v;
}
function fitStage(){
  var ih=window.innerHeight;
  var sh=(window.screen&&window.screen.height)||ih;
  var standalone=!!window.navigator.standalone;
  var safeTop=probeInset("top"), safeBot=probeInset("bottom");
  var h=ih, off=0, mode="Browser";
  if(standalone){
    if(sh>ih+2 && safeTop<=1){ off=sh-ih; h=sh; mode="unter Statusleiste"; }
    else if(sh>ih+2){ mode="transluzent, Fenster kuerzer um "+(sh-ih)+" px"; }
    else { mode="Vollbild"; }
  }
  if(CFG.area===1){ h=ih; off=0; mode="manuell: Fenster"; }
  else if(CFG.area===2){ h=sh; off=sh-ih; mode="manuell: Schirm"; }
  off+=(CFG.shift||0);
  STAGEH=h; OFFSET=off;
  stage.style.height=h+"px";  stage.style.top=(-off)+"px";
  calib.style.height=h+"px";  calib.style.top=(-off)+"px";
  DIAG="Fenster "+window.innerWidth+"×"+ih+" · Schirm "+(window.screen?window.screen.width:"?")+"×"+sh+

var tState=0, tLeft=0, tT0=0;

function tSet(st){ tState=st; bgKey=null; setBgFor(3); paintTimer(); }
function tStart(){ tLeft=tTotal(); tT0=performance.now(); tSet(1); wake(); }
function tToggle(){
  if(tState===1){ tLeft=tNow(); tSet(2); release(); }
  else if(tState===2){ tT0=performance.now(); tSet(1); wake(); }
}
function tCancel(){ tLeft=0; tSet(0); release(); }
function fmtT(ms){
  var t=Math.ceil(ms/1000), h=Math.floor(t/3600), m=Math.floor(t/60)%60, sec=t%60;

var lastLaps="", lastTime="";
function renderLaps(t){
  if(!CFG.l.on) return;
  var prev=0, durs=[];
  for(var i=0;i<bounds.length;i++){ durs.push(bounds[i]-prev); prev=bounds[i]; }
  var cur=t-prev, rows=[];
  var fastI=-1, slowI=-1;
  if(CFG.l.col && durs.length>=2){
    var mn=Infinity,mx=-Infinity;
    for(var j=0;j<durs.length;j++){
      if(durs[j]<mn){mn=durs[j];fastI=j;}
      if(durs[j]>mx){mx=durs[j];slowI=j;}
    }
    if(mn===mx){fastI=-1;slowI=-1;}
  }
  var st='style="height:'+CFG.l.rowh+'vw"';
  if(!isZero()){
    rows.push('<div class="lapRow" '+st+'><span>Runde '+(durs.length+1)+'</span><span>'+fmt(cur)+'</span></div>');
  }
  for(var k=durs.length-1;k>=0;k--){
    var cls="lapRow"+(k===fastI?" fast":(k===slowI?" slow":""));
    rows.push('<div class="'+cls+'" '+st+'><span>Runde '+(k+1)+'</span><span>'+fmt(durs[k])+'</span></div>');
  }
  var html=rows.join("");
  if(html!==lastLaps){ lapsEl.innerHTML=html; lastLaps=html; }
}
function frame(){
  var t=nowMs(), s=fmt(t);
  if(s!==lastTime){ timeEl.textContent=s; lastTime=s; }
  renderLaps(t);
  renderTimer();
  requestAnimationFrame(frame);
}

function shrink(dataUrl,cb){
  var im=new Image();
  im.onload=function(){
    var tw=Math.min(im.width, Math.round(window.innerWidth*3)); // Geraeteaufloesung
    var th=Math.round(im.height*tw/im.width);
    var cv=document.createElement("canvas"); cv.width=tw; cv.height=th;
    cv.getContext("2d").drawImage(im,0,0,tw,th);
    var out=null;
    try{ out=cv.toDataURL("image/webp",0.86); }catch(e){}
    if(!out||out.indexOf("data:image/webp")!==0){
      try{ out=cv.toDataURL("image/jpeg",0.9); }catch(e){ out=dataUrl; }
    }
    cb(out.length<dataUrl.length?out:dataUrl);
  };
  im.onerror=function(){ cb(dataUrl); };
  im.src=dataUrl;
}
document.getElementById("file").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    shrink(r.result,function(small){
      var key=VIEWS[CFG.view].k, before=CFG[key];
      CFG[key]=small; CFG.chrome=0; bgKey=null;
      if(!save()){
        CFG[key]=before; bgKey=null;
        window.alert("Speicher voll. Lösch ein anderes Bild ('Bild weg') und versuch es nochmal.");
      }
      var V=VIEWS[CFG.view];
      if(V.ts!==undefined) tState=V.ts;
      setTab(V.t); applyLayout(); syncInputs();
    });
  };
  r.readAsDataURL(f);
  e.target.value="";
});

/* ---------- Start ---------- */
window.addEventListener("resize",function(){ fitStage(); applyLayout(); positionBoxes(); });
window.addEventListener("orientationchange",function(){ setTimeout(function(){ fitStage(); applyLayout(); },300); });
buildTabs();
fitStage();
CFG.view=2;
tState=0;
setTab(2);
applyLayout();
requestAnimationFrame(frame);
})();
</script>
